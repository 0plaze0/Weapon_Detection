[project]
name = "weapon-detection"
version = "0.1.0"
description = "Real-time weapon detection using YOLO and OpenCV"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.9.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "roboflow>=1.7.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "python-dotenv>=1.2.4",
    "websockets>=16.1.1",
]


[project.scripts]
weapon-detect = "weapon_detection.__main__:main"
weapon-serve = "weapon_detection.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weapon_detection"]
